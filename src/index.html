<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio Interactive</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div id="canvas-container"></div>

        <div id="scroll-wrapper">
            <div
                id="content"
                class="text-white text-shadow-red-900 relative flex flex-col z-2 px-10"
            >
                <!-- Sección de entrada - Nombre y título -->
                <div id="home" class="flex flex-col justify-center min-h-screen">
                    <div class="flex gap-6">
                        <!-- Vertical line -->
                        <div class="flex flex-col items-center gap-3 py-2">
                            <span class="little-dot"></span>
                            <span class="vertical-line"></span>
                            <span class="little-dot"></span>
                        </div>

                        <!-- Content -->
                        <div class="flex flex-col gap-6">
                            <div class="flex flex-col gap-3">
                                <div class="flex gap-4">
                                    <span class="square"></span>
                                    <span class="line line-4 gradient-green rotate-180"></span>
                                    <span class="line line-3 gradient-blue"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="line line-2 gradient-gray rotate-180"></span>
                                    <span class="dot"></span>
                                    <span class="line line-4 gradient-orange"></span>
                                    <span class="dot"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="line line-5 gradient-pink"></span>
                                    <span class="square"></span>
                                    <span class="line line-4 gradient-gray"></span>
                                </div>
                            </div>

                            <div class="mb-8">
                                <h1 class="text-7xl font-bold text-white mb-2">Juan Aressi</h1>

                                <div class="text-rotator relative">
                                    <h3
                                        data-translate="header.title"
                                        class="text-2xl text-gray mb-2 absolute top-0 left-0 rotating-text active"
                                    ></h3>

                                    <h3
                                        data-translate="header.profession"
                                        class="text-2xl text-gray mb-2 absolute top-0 left-0 rotating-text"
                                    ></h3>
                                </div>
                            </div>

                            <div class="flex flex-col gap-3">
                                <div class="flex gap-4">
                                    <span class="line line-5 gradient-gray"></span>
                                    <span class="square"></span>
                                    <span class="line line-2 gradient-blue rotate-180"></span>
                                    <span class="dot"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="dot"></span>
                                    <span class="line line-2 gradient-orange rotate-180"></span>
                                    <span class="square"></span>
                                    <span class="line line-3 gradient-green"></span>
                                    <span class="dot"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Work Experience -->
                <div class="flex flex-col justify-center min-h-screen">
                    <div class="flex gap-6">
                        <!-- Vertical line -->
                        <div class="flex flex-col items-center gap-3 pt-4 pb-2">
                            <span class="little-dot"></span>
                            <span class="vertical-line"></span>
                            <span class="little-dot"></span>
                        </div>

                        <div class="flex flex-col gap-6">
                            <h2 data-translate="work.title" class="m-0 text-5xl"></h2>

                            <div class="flex flex-col gap-3">
                                <div class="flex gap-4">
                                    <span class="line line-5 gradient-blue"></span>
                                    <span class="square"></span>
                                    <span class="line line-2 gradient-orange rotate-180"></span>
                                    <span class="dot"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="dot"></span>
                                    <span class="line line-2 gradient-gray rotate-180"></span>
                                    <span class="square"></span>
                                    <span class="line line-3 gradient-pink"></span>
                                    <span class="dot"></span>
                                </div>
                            </div>

                            <div class="flex flex-col gap-3">
                                <!-- Persiscal -->
                                <div class="flex items-center company-item">
                                    <span class="line line-5 gradient-pink w-0"></span>
                                    <span class="text-2xl">Persiscal</span>
                                </div>

                                <!-- Patatag -->
                                <div class="flex items-center company-item">
                                    <span class="line line-2 gradient-orange w-0"></span>
                                    <span class="text-2xl">Patatag</span>
                                </div>

                                <!-- Ignitix -->
                                <div class="flex items-center company-item">
                                    <span class="line line-4 gradient-green w-0"></span>
                                    <span class="text-2xl">Ignitix</span>
                                </div>

                                <!-- Capgemini -->
                                <div class="flex items-center company-item">
                                    <span class="line line-5 gradient-blue w-0"></span>
                                    <span class="text-2xl">Capgemini</span>
                                </div>

                                <!-- Secco -->
                                <div class="flex items-center company-item">
                                    <span class="line line-3 gradient-pink w-0"></span>
                                    <span class="text-2xl">Secco</span>
                                </div>

                                <!-- SACSI -->
                                <div class="flex items-center company-item">
                                    <span class="line line-4 gradient-orange w-0"></span>
                                    <span class="text-2xl">SACSI</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- About Me -->
                <div id="about" class="flex flex-col justify-center min-h-screen text-white">
                    <div class="flex gap-6">
                        <!-- Vertical line -->
                        <div class="flex flex-col items-center gap-3 pt-4 pb-2">
                            <span class="little-dot"></span>
                            <span class="vertical-line"></span>
                            <span class="little-dot"></span>
                        </div>

                        <div class="flex flex-col gap-6">
                            <h2 data-translate="about.title" class="m-0 text-5xl">Hi, I'm Juan</h2>

                            <div class="flex flex-col gap-3">
                                <div class="flex gap-4">
                                    <span class="line line-5 gradient-orange"></span>
                                    <span class="square"></span>
                                    <span class="line line-2 gradient-gray rotate-180"></span>
                                    <span class="dot"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="dot"></span>
                                    <span class="line line-2 gradient-green rotate-180"></span>
                                    <span class="square"></span>
                                    <span class="line line-3 gradient-pink"></span>
                                    <span class="dot"></span>
                                </div>
                            </div>

                            <div class="flex flex-col gap-2 text-xl w-1/2">
                                <p data-translate="about.paragraph-1"></p>

                                <p data-translate="about.paragraph-2"></p>

                                <p data-translate="about.paragraph-3"></p>

                                <p data-translate="about.paragraph-4"></p>
                            </div>

                            <div class="flex flex-col gap-3">
                                <div class="flex gap-4">
                                    <span class="square"></span>
                                    <span class="line line-4 gradient-pink rotate-180"></span>
                                    <span class="line line-3 gradient-green"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="line line-2 gradient-gray rotate-180"></span>
                                    <span class="dot"></span>
                                    <span class="line line-4 gradient-orange rotate-180"></span>
                                    <span class="dot"></span>
                                </div>

                                <div class="flex gap-4">
                                    <span class="line line-5 gradient-green"></span>
                                    <span class="square"></span>
                                    <span class="line line-4 gradient-gray"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Barra de navegación inferior -->
        <nav id="bottom-nav" class="glass fixed z-10 py-5 px-10 rounded-4xl min-w-[500px]">
            <div class="relative flex justify-between items-center w-full">
                <div class="flex gap-[2rem]">
                    <!-- My Work -->
                    <div class="group relative cursor-pointer">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z"
                            />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            data-translate="navbar.work"
                        ></span>
                    </div>

                    <!-- About me -->
                    <div class="group relative cursor-pointer">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                            />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            data-translate="navbar.about"
                        ></span>
                    </div>
                </div>

                <!-- Translate -->
                <div class="group flex items-center cursor-pointer">
                    <div class="dropdown relative">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802"
                            />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            data-translate="navbar.translate"
                        ></span>

                        <div
                            class="glass dropdown-menu flex flex-col items-center justify-center absolute py-1 w-28 bottom-14 rounded-md"
                        >
                            <p
                                class="translate-button flex items-center justify-center w-full py-1 transition-all hover:bg-gray-100 cursor-pointer text-white hover:text-indigo-500"
                                data-language="en"
                            >
                                English
                            </p>

                            <p
                                class="translate-button flex items-center justify-center w-full py-1 transition-all hover:bg-gray-100 cursor-pointer text-white hover:text-indigo-500"
                                data-language="es"
                            >
                                Español
                            </p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-8">
                    <!-- Email -->
                    <div class="group relative cursor-pointer">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M21.75 9v.906a2.25 2.25 0 0 1-1.183 1.981l-6.478 3.488M2.25 9v.906a2.25 2.25 0 0 0 1.183 1.981l6.478 3.488m8.839 2.51-4.66-2.51m0 0-1.023-.55a2.25 2.25 0 0 0-2.134 0l-1.022.55m0 0-4.661 2.51m16.5 1.615a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V8.844a2.25 2.25 0 0 1 1.183-1.981l7.5-4.039a2.25 2.25 0 0 1 2.134 0l7.5 4.039a2.25 2.25 0 0 1 1.183 1.98V19.5Z"
                            />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            data-translate="navbar.email"
                        ></span>
                    </div>

                    <!-- GitHub -->
                    <div class="group relative cursor-pointer">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-github-icon lucide-github size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                            />
                            <path d="M9 18c-4.51 2-5-2-7-2" />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            >GitHub</span
                        >
                    </div>

                    <!-- LinkedIn -->
                    <div class="group relative cursor-pointer">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="size-6 text-white transition-all duration-500 group-hover:rotate-y-360 group-hover:-translate-y-2 group-hover:text-indigo-500"
                        >
                            <path
                                d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                            />
                            <rect width="4" height="12" x="2" y="9" />
                            <circle cx="4" cy="4" r="2" />
                        </svg>
                        <span
                            class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-2 text-white text-sm opacity-0 group-hover:opacity-100 transition-all duration-300 whitespace-nowrap group-hover:text-indigo-500"
                            >LinkedIn</span
                        >
                    </div>
                </div>
            </div>
        </nav>

        <div id="scroll-bar" class="fixed top-0 right-0 w-2 h-full bg-white/10 z-10">
            <div id="scroll-progress" class="w-full h-0 bg-indigo-500"></div>
        </div>

        <script type="module" src="js/index.js"></script>
        <script type="module" src="js/translation.ts"></script>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const dropdown = document.querySelector('.dropdown');

                dropdown.addEventListener('click', function (e) {
                    e.stopPropagation();
                    this.classList.toggle('active');
                });

                // Cerrar dropdown al hacer click fuera
                document.addEventListener('click', function () {
                    dropdown.classList.remove('active');
                });
            });
        </script>
    </body>
</html>
